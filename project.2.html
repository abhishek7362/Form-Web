<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project.2</title>
    <link rel="stylesheet" href="project.2.css">
</head>
<body>
    <div class="container">

        <div class="applybox">
          <h1>Job Application
            <span class="title_small">(Web)</span>
          </h1>
          <form action="">
            <div class="form_cotainer">
                <label for="first_name">First Name</label>
                <input id="first_name" name="fiest_name" placeholder="Enter First Name">
            </div>
            <form action="">
                <div class="form_cotainer">
                    <label for="last_name">Last Name</label>
                    <input id="last_name" name="last_name" placeholder="Enter Last Name">
                </div>
                <form action="">
                    <div class="form_cotainer">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="Enter Email">
                    </div>
          </form> 
          <form action="">
            <div class="form_cotainer">
                <label for="job_rol">First Name</label>
               <select name="job_rol" id="job_rol">
                <option value="">select Job Rol</option>
                <option value="frontent">Frontent Developer</option>
                <option value="backend">Backend Developer</option>
                <option value="full_stock">Full stock Developer</option>
                <option value="ui_ux">UI UX Developer</option>
               </select>
            </div> 
            <div class="form_cotainer">
                <label for="adress">Adress</label>
                <textarea name="adress" id="adress" cols="50" rows="4" placeholder="enter adress"></textarea>
            </div>
            <div class="form_cotainer">
                <label for="city">City</label>
                <input type="city" id="city" name="city" placeholder="Enter city">
            </div>
            <div class="form_cotainer">
                <label for="pincode">Pincode</label>
                <input type="number" id="pincode" name="pincode" placeholder="Enter pincode">
            </div>
            <div class="form_cotainer">
                <label for="date">Start Date</label>
                <input value="2024-02-21" type="date" id="date" name="date" >
            </div>
            <div class="form_cotainer">
                <label for="upload">Upload Your CV</label>
                <input  type="file" id="upload" name="upload" >
            </div>
            <div class="button">
                <button type="submit">Apply Now</button>
            </div>
        </div>
    </div>
</body>
</html>
